# EMP-02/EMP-05: an enabled employee signs in with Employee ID and password and lands on Today.
# Needs: -e E2E_EMPLOYEE_ID=NV-000123 -e E2E_EMPLOYEE_PASSWORD=...
#        (-e E2E_EMPLOYEE_NEW_PASSWORD=... only if the account still has an HR temporary password)
appId: in.nestovin.employee
name: employee_sign_in
tags:
  - auth
  - smoke
  - live
---
- launchApp:
    clearState: true
    permissions:
      notifications: allow
      location: allow
      camera: allow
- runFlow: subflows/sign_in.yaml
- assertVisible: "Today"
- assertVisible: "Schedule"
- assertVisible: "Updates"
- assertVisible: "Me"
- assertVisible: "Visits today: .*"
