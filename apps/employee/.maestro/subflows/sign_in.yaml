# Reusable: EMP-02 Employee ID + password sign-in (src/app/sign-in.tsx). Starts signed out.
# Needs: E2E_EMPLOYEE_ID (e.g. NV-000123), E2E_EMPLOYEE_PASSWORD.
#
# Selectors:
#  - Employee ID input: tapped by its placeholder "NV-000123" (label Text and input share "Employee ID").
#  - Password input: no placeholder, so label + index 1 (index 0 is the label Text).
#  - "Sign in" is both the page title and the footer button; the button is the one below the
#    "Forgot your password?" card.
#  TODO(app): testIDs "employee-id-input", "password-input", "sign-in-button".
appId: in.nestovin.employee
---
- runFlow: open_sign_in.yaml
- tapOn: "NV-000123"
- inputText: ${E2E_EMPLOYEE_ID}
- tapOn:
    text: "Password"
    index: 1
- inputText: ${E2E_EMPLOYEE_PASSWORD}
- hideKeyboard
- tapOn:
    text: "Sign in"
    below:
      text: "Ask HR to reset it.*"
- extendedWaitUntil:
    visible: 'Today|Set your own password|Employee ID or password is not correct\.'
    timeout: 30000
# First login with an HR temporary password forces a change (src/app/change-password.tsx). The new
# password must differ from the temporary one, so it comes from E2E_EMPLOYEE_NEW_PASSWORD; afterwards
# use that value as E2E_EMPLOYEE_PASSWORD. Prefer a test employee that has already changed it.
- runFlow:
    when:
      visible: "Set your own password"
    commands:
      - tapOn:
          text: "New password"
          index: 1
      - inputText: ${E2E_EMPLOYEE_NEW_PASSWORD}
      - tapOn:
          text: "Type it again"
          index: 1
      - inputText: ${E2E_EMPLOYEE_NEW_PASSWORD}
      - hideKeyboard
      - tapOn: "Save new password"
- extendedWaitUntil:
    visible: "Today"
    timeout: 30000
