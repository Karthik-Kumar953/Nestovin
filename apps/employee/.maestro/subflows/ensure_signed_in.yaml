# Reusable: open the Worker app and sign in only if it is signed out.
# A demo build (EXPO_PUBLIC_DEMO=1) is always signed in, so the sign-in step is skipped there.
appId: in.nestovin.employee
---
- launchApp:
    permissions:
      notifications: allow
      location: allow
      camera: allow
# Signed in: the tab bar (Today, Schedule, Updates, Me). Signed out: Welcome or the sign-in form.
- extendedWaitUntil:
    visible: 'Schedule|Sign in with Employee ID|Use the Employee ID and password HR gave you\.'
    timeout: 30000
- runFlow:
    when:
      notVisible: "Schedule"
    file: sign_in.yaml
