# EMP-06: a wrong or expired code is rejected with a reason; attendance is not recorded.
# Live: 000000 is never an issued code. Demo build: 000000 is the fixture's rejected code.
appId: in.nestovin.employee
name: attendance_check_in_invalid_code
tags:
  - attendance
  - live
  - demo-ok
env:
  CHECK_IN_CODE: "000000"
---
- runFlow: subflows/ensure_signed_in.yaml
- runFlow: subflows/open_check_in.yaml
- runFlow: subflows/enter_check_in_code.yaml
- assertVisible: "Check-in not accepted"
- assertVisible: "Check the 6 digits with the resident and try again.*"
- assertVisible: "Try again"
- assertNotVisible: "You are checked in|Checked in"
