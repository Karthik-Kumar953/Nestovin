# RES-10/11 + EMP-06 (resident side): show the 6-digit check-in code and QR.
# Precondition: the test resident has a visit today with a worker assigned.
appId: in.nestovin.resident
name: visit_check_in_code
tags:
  - visits
---
- runFlow: subflows/ensure_signed_in.yaml
- tapOn: "Visits"
- extendedWaitUntil:
    visible: "Upcoming"
    timeout: 15000
- scrollUntilVisible:
    element:
      text: "Show check-in code"
    timeout: 15000
- tapOn: "Show check-in code"
- extendedWaitUntil:
    visible: "Check-in code"
    timeout: 15000
- assertVisible: '\d{6}'
- assertVisible: 'Valid for \d+:\d{2}'
- tapOn: "Done"
- assertVisible: "Upcoming"
