# Reusable: phone OTP sign-in (RES-01, src/app/sign-in.tsx).
# Fields have accessibilityLabel = their label, so the label Text and the input
# both match; index 1 is the input. TODO(app): add testID props to Field inputs
# (e.g. "phone-input", "otp-input") and switch to `id:` selectors.
appId: in.nestovin.resident
---
- extendedWaitUntil:
    visible: "Welcome to Nestovin"
    timeout: 20000
- tapOn:
    text: "Mobile number"
    index: 1
- inputText: ${E2E_RESIDENT_PHONE}
- hideKeyboard
- tapOn: "Send code"
- extendedWaitUntil:
    visible: "We sent a 6-digit code to.*"
    timeout: 20000
- tapOn:
    text: "Code"
    index: 1
- inputText: ${E2E_RESIDENT_OTP}
- hideKeyboard
- tapOn: "Verify and continue"
- extendedWaitUntil:
    visible: "Hello.*"
    timeout: 30000
