# Reusable: Profile -> "Bookings and payments" -> the first booking or booking-round request that
# needs money -> its pay button. Ends with Razorpay Checkout opening.
# Precondition: the test resident has a booking "Awaiting payment" / "Balance due", or a booking-round
# request "Not paid yet" (labels from src/lib/status.ts). Create one from Book, or seed it.
#
# Cards are matched by their accessibilityLabel "<plan>, <selection or round>, <status label>"
# (src/app/(app)/bookings/index.tsx). Pay buttons (src/app/(app)/bookings/[id].tsx):
# "Pay ₹X", "Pay balance ₹X", "Pay ₹X and join".
# TODO(app): testIDs "booking-card" and "pay-button" would remove these regexes.
appId: in.nestovin.resident
---
- tapOn: "Profile"
- scrollUntilVisible:
    element:
      text: "Bookings and payments"
    timeout: 15000
- tapOn: "Bookings and payments"
- extendedWaitUntil:
    visible: "Current"
    timeout: 15000
- scrollUntilVisible:
    element:
      text: ".*, (Awaiting payment|Balance due|Not paid yet)"
    timeout: 20000
- tapOn: ".*, (Awaiting payment|Balance due|Not paid yet)"
- extendedWaitUntil:
    visible: "Pay (balance )?₹[0-9,.]+( and join)?"
    timeout: 15000
- tapOn: "Pay (balance )?₹[0-9,.]+( and join)?"
