# Reusable: complete Razorpay Checkout in TEST MODE with the published success VPA.
# Razorpay test keys only (rzp_test_...). The checkout is a WebView; labels below
# match the standard checkout and may need adjusting if Razorpay changes its UI.
appId: in.nestovin.resident
---
- extendedWaitUntil:
    visible: ".*UPI.*"
    timeout: 30000
- runFlow:
    when:
      visible: "Email.*"
    commands:
      - tapOn: "Email.*"
      - inputText: ${E2E_PAYMENT_EMAIL}
      - hideKeyboard
- tapOn: ".*UPI.*"
- tapOn:
    text: ".*UPI ID.*|.*VPA.*|.*example@okhdfcbank.*"
    optional: true
- inputText: "success@razorpay"
- hideKeyboard
- tapOn: "Pay.*|Verify and Pay|Continue"
