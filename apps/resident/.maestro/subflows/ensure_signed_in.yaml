# Reusable: open the Resident app and sign in only if the sign-in screen shows.
# A demo build (EXPO_PUBLIC_DEMO=1) is always signed in, so the sign-in step is skipped there.
appId: in.nestovin.resident
---
- launchApp:
    permissions:
      notifications: allow
- extendedWaitUntil:
    visible: "Sign in or create an account|Profile"
    timeout: 30000
- runFlow:
    when:
      visible: "Sign in or create an account"
    file: sign_in.yaml
