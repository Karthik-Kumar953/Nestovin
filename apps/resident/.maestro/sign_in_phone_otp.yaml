# RES-01: sign in with a Supabase test phone number + fixed OTP, then sign out.
# Needs: -e E2E_RESIDENT_PHONE=9xxxxxxxxx -e E2E_RESIDENT_OTP=123456
appId: in.nestovin.resident
name: sign_in_phone_otp
tags:
  - auth
  - smoke
---
- launchApp:
    clearState: true
    permissions:
      notifications: allow
- runFlow: subflows/sign_in.yaml
- assertVisible: "Home"
- assertVisible: "Book"
- assertVisible: "Visits"
- assertVisible: "Support"
- assertVisible: "Profile"
# A wrong code is rejected (separate attempt after sign-out would hit the
# 60-second OTP resend limit, so the negative case lives in the web suite).
- tapOn: "Profile"
- extendedWaitUntil:
    visible: "Signed in as.*"
    timeout: 15000
- scrollUntilVisible:
    element:
      text: "Sign out"
- tapOn: "Sign out"
- extendedWaitUntil:
    visible: "Welcome to Nestovin"
    timeout: 15000
