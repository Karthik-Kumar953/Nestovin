# RES-08/09: pay a pending booking or demand request with Razorpay TEST MODE UPI.
# Preconditions:
#  - a development build (react-native-razorpay is native; Expo Go shows
#    "Payments need the Nestovin app build").
#  - the API uses Razorpay test keys (rzp_test_...).
#  - the test resident has a booking "Awaiting payment" or a demand request
#    "Awaiting payment" (create one from Book, or seed it).
# Needs: E2E_RESIDENT_PHONE, E2E_RESIDENT_OTP, E2E_PAYMENT_EMAIL (used only if Razorpay asks).
appId: in.nestovin.resident
name: razorpay_test_payment_upi
tags:
  - payments
  - native-only
---
- runFlow: subflows/ensure_signed_in.yaml
- tapOn: "Home"
- scrollUntilVisible:
    element:
      text: "My bookings and payments"
- tapOn: "My bookings and payments"
- extendedWaitUntil:
    visible: "Bookings and payments"
    timeout: 15000
- scrollUntilVisible:
    element:
      text: "Pay (balance )?₹.*"
    timeout: 20000
- tapOn: "Pay (balance )?₹.*"
- runFlow: subflows/razorpay_upi_success.yaml
- extendedWaitUntil:
    visible: 'Payment received and verified\.'
    timeout: 60000
- assertNotVisible: "Payment was not completed.*"
