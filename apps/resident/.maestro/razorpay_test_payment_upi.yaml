# RES-08/09: pay a pending booking or booking-round request with Razorpay TEST MODE UPI
# (success@razorpay) and stop on the app's success screen (src/app/(app)/payment-result.tsx).
# Preconditions:
#  - a development build (react-native-razorpay is native; Expo Go and web show
#    "Pay in the Nestovin app build"). NOT a demo build: demo mode skips Razorpay entirely.
#  - the API runs with Razorpay TEST keys (rzp_test_...).
#  - the test resident has something to pay (see subflows/open_payable_booking.yaml).
# Needs: E2E_RESIDENT_PHONE, E2E_RESIDENT_OTP; E2E_PAYMENT_EMAIL only if Razorpay asks for an email.
appId: in.nestovin.resident
name: razorpay_test_payment_upi
tags:
  - payments
  - native-only
  - live
env:
  RZP_TEST_VPA: success@razorpay
---
- runFlow: subflows/ensure_signed_in.yaml
- runFlow: subflows/open_payable_booking.yaml
- runFlow: subflows/razorpay_upi.yaml
# Success titles depend on what was paid (copyFor in payment-result.tsx). The trailing .* also matches
# the screen's grouped accessibility label "<title>. <body>".
- extendedWaitUntil:
    visible: "(Your service is confirmed|Balance paid|You have joined the booking round|Plan renewed).*"
    timeout: 90000
- assertVisible: "View booking"
- assertVisible: "Back to Home"
- assertNotVisible: "(Payment not completed|Payment did not go through|Checking your payment).*"
